<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Toolkit</title>
  <meta name="theme-color" content="#0f1419">
  <meta name="description" content="Offline productivity toolkit: focus timer, calculator, unit converter, scratchpad.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar" id="titlebar">
    <div class="brand"><span class="logo" aria-hidden="true"></span><strong>Toolkit</strong></div>
    <nav class="tabs" role="tablist" aria-label="Tools">
      <button role="tab" data-tool="focus"   aria-selected="true"  id="tab-focus">Focus <kbd>1</kbd></button>
      <button role="tab" data-tool="calc"    aria-selected="false" id="tab-calc">Calculator <kbd>2</kbd></button>
      <button role="tab" data-tool="convert" aria-selected="false" id="tab-convert">Converter <kbd>3</kbd></button>
      <button role="tab" data-tool="notes"   aria-selected="false" id="tab-notes">Scratchpad <kbd>4</kbd></button>
    </nav>
    <div class="actions">
      <button id="install" class="btn ghost" hidden>Install app</button>
      <button id="theme" class="btn ghost" title="Toggle theme" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <main>
    <!-- FOCUS -->
    <section id="panel-focus" class="panel" role="tabpanel" aria-labelledby="tab-focus">
      <div class="card timer-card">
        <div class="modes" role="group" aria-label="Timer mode">
          <button class="chip active" data-mode="work">Focus</button>
          <button class="chip" data-mode="short">Short break</button>
          <button class="chip" data-mode="long">Long break</button>
        </div>
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ring-bg" cx="60" cy="60" r="54"/>
            <circle class="ring-fg" id="ring-fg" cx="60" cy="60" r="54"/>
          </svg>
          <div class="time" id="time" role="timer" aria-live="off">25:00</div>
        </div>
        <div class="controls">
          <button class="btn primary big" id="start">Start <kbd>Space</kbd></button>
          <button class="btn" id="reset">Reset <kbd>R</kbd></button>
          <button class="btn" id="skip">Skip <kbd>N</kbd></button>
        </div>
        <p class="muted" id="session-label">Session 1 of 4 · Keeps screen awake while running</p>
      </div>
      <div class="card">
        <h2>Settings</h2>
        <div class="grid3">
          <label>Focus (min)<input type="number" id="set-work" min="1" max="180" value="25"></label>
          <label>Short break<input type="number" id="set-short" min="1" max="60" value="5"></label>
          <label>Long break<input type="number" id="set-long" min="1" max="90" value="15"></label>
        </div>
        <label class="check"><input type="checkbox" id="set-notify"> Notify me when a session ends</label>
        <label class="check"><input type="checkbox" id="set-sound" checked> Play a soft chime</label>
        <h2>Today</h2>
        <p class="stat"><span id="stat-today">0</span> sessions · <span id="stat-min">0</span> focused minutes</p>
      </div>
    </section>

    <!-- CALCULATOR -->
    <section id="panel-calc" class="panel" role="tabpanel" aria-labelledby="tab-calc" hidden>
      <div class="card calc-card">
        <input id="calc-input" class="calc-input" type="text" inputmode="decimal" autocomplete="off" spellcheck="false"
               placeholder="Type an expression, e.g. (12.5 + 7) * 3 / 2^2" aria-label="Expression">
        <div class="calc-result" id="calc-result" aria-live="polite">0</div>
        <div class="keys" id="keys"></div>
      </div>
      <div class="card">
        <div class="row-between"><h2>History</h2><button class="btn ghost small" id="calc-clear-hist">Clear</button></div>
        <ul class="history" id="calc-history"></ul>
        <p class="muted">Supports + − × ÷ ^ % ( ), sqrt(), sin/cos/tan (degrees), ln, log, abs, pi, e, and <code>ans</code>.</p>
      </div>
    </section>

    <!-- CONVERTER -->
    <section id="panel-convert" class="panel" role="tabpanel" aria-labelledby="tab-convert" hidden>
      <div class="card">
        <div class="modes" id="conv-cats" role="group" aria-label="Category"></div>
        <div class="conv-grid">
          <div>
            <label for="conv-from-val">From</label>
            <input id="conv-from-val" type="number" inputmode="decimal" value="1" step="any">
            <select id="conv-from-unit" aria-label="From unit"></select>
          </div>
          <button class="btn swap" id="conv-swap" title="Swap units" aria-label="Swap units">⇄</button>
          <div>
            <label for="conv-to-val">To</label>
            <input id="conv-to-val" type="number" inputmode="decimal" step="any">
            <select id="conv-to-unit" aria-label="To unit"></select>
          </div>
        </div>
        <p class="muted" id="conv-note"></p>
      </div>
    </section>

    <!-- SCRATCHPAD -->
    <section id="panel-notes" class="panel" role="tabpanel" aria-labelledby="tab-notes" hidden>
      <div class="card notes-card">
        <div class="row-between">
          <h2>Scratchpad</h2>
          <div class="row-gap">
            <span class="muted" id="notes-status">Saved</span>
            <button class="btn small" id="notes-open">Open file</button>
            <button class="btn small" id="notes-save">Save as file</button>
            <button class="btn small ghost" id="notes-clear">Clear</button>
          </div>
        </div>
        <textarea id="notes" spellcheck="true" placeholder="Jot anything down. It autosaves on this device and works offline."></textarea>
        <p class="muted"><span id="notes-count">0 words</span> · Autosaved locally · Ctrl+S saves a file</p>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="app.js"></script>
</body>
</html>
